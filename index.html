<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title">Our Company</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="site-header">

    <div class="container header-inner">

        <a href="#home" class="logo" id="header-company">
            Our Company
        </a>

        <nav class="main-menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>

    </div>

</header>


<!-- =========================
     HERO
========================= -->

<section id="home" class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <h1 id="hero-title"></h1>

        <p id="hero-description"></p>

        <a id="hero-button" class="btn" href=""></a>

    </div>

</section>


<!-- =========================
     ABOUT US
========================= -->

<section id="about" class="about section">

    <div class="container about-grid">

        <div class="about-content">

            <span class="section-label">
                About Us
            </span>

            <h2 id="about-title"></h2>

            <div id="about-content"></div>

            <a id="about-button" class="btn" href=""></a>

        </div>


        <div class="about-image">

            <img
                id="about-image"
                src=""
                alt="About Us"
            >

        </div>

    </div>

</section>


<!-- =========================
     SERVICES
========================= -->

<section id="services" class="services section">

    <div class="container">

        <div class="section-heading">

            <span class="section-label">
                What We Do
            </span>

            <h2 id="services-title"></h2>

            <p id="services-description"></p>

        </div>


        <div class="services-grid">


            <!-- SERVICE 1 -->

            <div class="service-box">

                <div class="service-number">
                    01
                </div>

                <h3 id="service-1-title"></h3>

                <p id="service-1-description"></p>

                <a id="service-1-link" href="">
                    Learn More →
                </a>

            </div>


            <!-- SERVICE 2 -->

            <div class="service-box">

                <div class="service-number">
                    02
                </div>

                <h3 id="service-2-title"></h3>

                <p id="service-2-description"></p>

                <a id="service-2-link" href="">
                    Learn More →
                </a>

            </div>


            <!-- SERVICE 3 -->

            <div class="service-box">

                <div class="service-number">
                    03
                </div>

                <h3 id="service-3-title"></h3>

                <p id="service-3-description"></p>

                <a id="service-3-link" href="">
                    Learn More →
                </a>

            </div>

        </div>

    </div>

</section>


<!-- =========================
     CONTACT
========================= -->

<section id="contact" class="contact section">

    <div class="container contact-grid">


        <!-- CONTACT DETAILS -->

        <div class="contact-content">

            <span class="section-label">
                Get In Touch
            </span>

            <h2 id="contact-title"></h2>

            <p id="contact-description"></p>


            <div class="contact-details">

                <div class="contact-item">

                    <div class="contact-icon">
                        ☎
                    </div>

                    <div>
                        <strong>Phone</strong>

                        <a id="contact-phone" href=""></a>
                    </div>

                </div>


                <div class="contact-item">

                    <div class="contact-icon">
                        ✉
                    </div>

                    <div>
                        <strong>Email</strong>

                        <a id="contact-email" href=""></a>
                    </div>

                </div>


                <div class="contact-item">

                    <div class="contact-icon">
                        📍
                    </div>

                    <div>

                        <strong>Address</strong>

                        <p id="contact-address"></p>

                    </div>

                </div>

            </div>

        </div>


        <!-- MAP -->

        <div class="contact-map">

            <iframe
                id="contact-map"
                src=""
                loading="lazy"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer class="site-footer">

    <div class="container footer-grid">


        <!-- FOOTER ABOUT -->

        <div class="footer-column">

            <h3 id="footer-company"></h3>

            <p id="footer-description"></p>

        </div>


        <!-- FOOTER MENU -->

        <div class="footer-column">

            <h3>
                Quick Links
            </h3>

            <ul>

                <li>
                    <a href="#home">Home</a>
                </li>

                <li>
                    <a href="#about">About Us</a>
                </li>

                <li>
                    <a href="#services">Services</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>

            </ul>

        </div>


        <!-- FOOTER CONTACT -->

        <div class="footer-column">

            <h3>
                Contact
            </h3>

            <p id="footer-phone"></p>

            <p id="footer-email"></p>

            <p id="footer-address"></p>

        </div>


    </div>


    <div class="footer-bottom">

        <div class="container">

            <p id="footer-copyright"></p>

        </div>

    </div>

</footer>


<!-- JavaScript -->

<script src="script.js"></script>

</body>

</html>
