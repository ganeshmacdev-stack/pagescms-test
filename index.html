<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Company</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background: #ffffff;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 60px 20px;
            background: #f5f5f5;
        }

        .hero-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;

            align-items: center;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-title {
            margin: 0 0 25px;
            font-size: 52px;
            line-height: 1.1;
        }

        .hero-description {
            margin: 0 0 35px;
            font-size: 20px;
            line-height: 1.7;
            color: #555;
        }

        .hero-button {
            display: inline-block;
            padding: 15px 30px;

            background: #222;
            color: #ffffff;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            border-radius: 5px;

            transition: all 0.3s ease;
        }

        .hero-button:hover {
            background: #444;
        }

        .hero-image-wrapper {
            width: 100%;
        }

        .hero-image {
            display: block;

            width: 100%;
            height: 500px;

            object-fit: cover;

            border-radius: 10px;
        }

        /* Tablet */

        @media (max-width: 900px) {

            .hero-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .hero-content {
                max-width: 100%;
            }

            .hero-title {
                font-size: 42px;
            }

            .hero-image {
                height: 400px;
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            .hero {
                padding: 40px 20px;
            }

            .hero-title {
                font-size: 34px;
            }

            .hero-description {
                font-size: 17px;
            }

            .hero-image {
                height: 300px;
            }

        }

    </style>

</head>


<body>


<section class="hero">

    <div class="hero-container">


        <!-- LEFT SIDE -->

        <div class="hero-content">

            <h1
                id="hero-title"
                class="hero-title">
                Loading...
            </h1>


            <p
                id="hero-description"
                class="hero-description">
                Loading...
            </p>


            <a
                id="hero-button"
                class="hero-button"
                href="#">
                Loading...
            </a>

        </div>


        <!-- RIGHT SIDE -->

        <div class="hero-image-wrapper">

            <img
                id="hero-image"
                class="hero-image"
                src=""
                alt="Hero Image">

        </div>


    </div>

</section>


<script>

fetch('data/site.json')

    .then(response => response.json())

    .then(data => {


        /*
         * Hero Title
         */

        document.getElementById('hero-title').textContent =
            data.hero_title;


        /*
         * Hero Description
         */

        document.getElementById('hero-description').textContent =
            data.hero_description;


        /*
         * Button
         */

        const button =
            document.getElementById('hero-button');

        button.textContent =
            data.button_text;

        button.href =
            data.button_url;


        /*
         * Hero Image
         */

        const image =
            document.getElementById('hero-image');

        image.src =
            data.hero_image;


    })

    .catch(error => {

        console.error(
            'Error loading CMS content:',
            error
        );

    });

</script>


</body>

</html>
