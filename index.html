<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pages CMS Test</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .hero {
            max-width: 800px;
            margin: 100px auto;
            padding: 50px;
            text-align: center;
            background: #ffffff;
            border-radius: 10px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="hero">

    <h1 id="title">Loading...</h1>

    <p id="description">Loading...</p>

    <a href="#" id="button" class="button">Loading...</a>

</div>

<script>

fetch('data/site.json')
    .then(response => response.json())
    .then(data => {

        document.getElementById('title').textContent = data.title;

        document.getElementById('description').textContent =
            data.description;

        document.getElementById('button').textContent =
            data.button_text;

    })
    .catch(error => {

        console.error('Error loading content:', error);

    });

</script>

</body>
</html>
