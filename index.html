<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Company</title>
    <link rel="stylesheet" href="style.css">

    

</head>


<body>


<section class="hero">

    <div class="hero-container">


        <!-- LEFT SIDE -->

        <div class="hero-content">

            <h1
                id="hero-title"
                class="hero-title">
                Loading...
            </h1>


            <p
                id="hero-description"
                class="hero-description">
                Loading...
            </p>


            <a
                id="hero-button"
                class="hero-button"
                href="#">
                Loading...
            </a>

        </div>


        <!-- RIGHT SIDE -->

        <div class="hero-image-wrapper">

            <img
                id="hero-image"
                class="hero-image"
                src=""
                alt="Hero Image">

        </div>


    </div>

</section>


<script>

fetch('data/site.json')

    .then(response => response.json())

    .then(data => {


        /*
         * Hero Title
         */

        document.getElementById('hero-title').textContent =
            data.hero_title;


        /*
         * Hero Description
         */

        document.getElementById('hero-description').textContent =
            data.hero_description;


        /*
         * Button
         */

        const button =
            document.getElementById('hero-button');

        button.textContent =
            data.button_text;

        button.href =
            data.button_url;


        /*
         * Hero Image
         */

        const image =
            document.getElementById('hero-image');

        image.src =
            data.hero_image;


    })

    .catch(error => {

        console.error(
            'Error loading CMS content:',
            error
        );

    });

</script>


</body>

</html>
